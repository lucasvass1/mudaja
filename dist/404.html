<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ff5a1f" />
    <title>Página não encontrada — MudaJá</title>
    <link rel="icon" type="image/png" href="./assets/mudaja-logo-mj.png" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
      .not-found { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 18px; }
      .not-found .code { font: 800 clamp(3rem, 12vw, 6rem)/1 "Manrope"; letter-spacing: -.05em; color: var(--orange); }
      .not-found h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin: 0; }
      .not-found p { color: var(--muted); max-width: 420px; margin: 0; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <span class="code">404</span>
      <h1>Essa página ainda não existe.</h1>
      <p>O endereço que você tentou acessar não foi encontrado. Que tal voltar para a página inicial do MudaJá?</p>
      <a class="button button-primary" href="/">Voltar para o início <span>↗</span></a>
    </main>
  </body>
</html>
